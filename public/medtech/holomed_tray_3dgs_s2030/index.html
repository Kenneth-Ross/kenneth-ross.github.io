<!doctype html>
<!-- HoloMed instrument tray: 3D Gaussian Splat (Spark 2.3.1 on three.js 0.180) with per-splat instance labels.
     Files: scene.spz (or ?file=scene.splat), labels.bin (uint8 per splat, file order), labels.json (instances/classes).
     URL params: mode=photo|instance|class  boxes=0|1  tags=0|1 (all tags; the hovered tool's tag always shows)
                 tools=0|1 (hide drape/towel/rolls)  frames=N (render N frames then stop: screenshots on software GL)
                 hover=<instance id>  cam=x,y,z  target=x,y,z  file=<splat file>
     Serve the folder over HTTP (fetch() does not work from file://), e.g. `python3 -m http.server`. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HoloMed tray · 3DGS + instance labels</title>
<style>
  :root { --paper: oklch(18% .006 80); --ink: oklch(94% .006 80); --muted: oklch(72% .007 80); --rule: oklch(34% .008 80); --accent: oklch(79% .14 78); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1f27; font: 13px/1.35 system-ui, sans-serif; color: #e8ecf3; }
  #panel { position: absolute; top: 12px; left: 12px; width: min(268px, calc(100% - 48px)); max-height: calc(100% - 24px); overflow: auto;
           background: rgba(18, 21, 28, 0.88); border: 1px solid #2c3442; border-radius: 10px; padding: 12px 12px 8px; z-index: 3; }
  #panel h1 { font-size: 14px; margin: 0 0 2px; } #panel .sub { color: #93a0b5; font-size: 11.5px; margin-bottom: 10px; }
  .seg { display: flex; gap: 0; margin: 6px 0 8px; } .seg button { flex: 1; background: #252c39; color: #cfd6e2; border: 1px solid #364055;
           padding: 5px 0; cursor: pointer; font: inherit; } .seg button:first-child { border-radius: 6px 0 0 6px; }
  .seg button:last-child { border-radius: 0 6px 6px 0; } .seg button.on { background: #3d63c9; color: #fff; border-color: #3d63c9; }
  label.tg { display: inline-flex; align-items: center; gap: 4px; margin: 0 10px 4px 0; cursor: pointer; color: #cfd6e2; }
  .cls { margin-top: 8px; } .cls > .h { display: flex; align-items: center; gap: 6px; font-weight: 600; margin: 6px 0 2px; }
  .chip { width: 10px; height: 10px; border-radius: 2px; flex: none; }
  .it { display: flex; align-items: center; gap: 6px; padding: 1px 4px; border-radius: 4px; cursor: pointer; color: #c7cfdc; }
  .it .m { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  button.it { width: 100%; border: 0; background: transparent; text-align: left; font: inherit; }
  .it:hover, .it.hot { background: #2b3446; color: #fff; } .it .n { margin-left: auto; color: #7f8aa0; font-size: 11px; flex: none; padding-left: 6px; }
  #stats { margin-top: 10px; color: #7f8aa0; font-size: 11px; border-top: 1px solid #2c3442; padding-top: 6px; }
  #info { position: absolute; right: 12px; bottom: 12px; min-width: 220px; background: rgba(18, 21, 28, 0.9); border: 1px solid #2c3442;
          border-radius: 8px; padding: 8px 10px; display: none; z-index: 3; } #info b { font-size: 13.5px; }
  #info .k { color: #93a0b5; }
  .tag { font: 600 10.5px/1 system-ui, sans-serif; color: #fff; padding: 2px 4px; border-radius: 3px; white-space: nowrap;
         background: rgba(10, 12, 18, 0.72); border-left: 3px solid; transform: translateY(-10px); pointer-events: none; }
  .tag.hot { font-size: 12.5px; background: rgba(10, 12, 18, 0.92); }
  #warn { position: absolute; top: 12px; right: 12px; background: #7a2630; padding: 6px 10px; border-radius: 6px; display: none; z-index: 4; }
  #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #93a0b5; z-index: 2; }
  button:focus-visible, summary:focus-visible, .it:focus-visible { outline: 2px solid #edb448; outline-offset: 2px; }
  summary { cursor: pointer; padding: 8px 0; }
  @media (max-width: 600px) { #stats { display: none; } #info { min-width: 0; max-width: calc(100% - 48px); font-size: 11px; } }
  html, body { background: var(--paper); color: var(--ink); }
  #panel, #info { background: color-mix(in oklch, var(--paper) 94%, transparent); border-color: var(--rule); border-radius: 0; }
  .seg button { background: var(--paper); color: var(--muted); border-color: var(--rule); }
  .seg button.on { background: var(--accent); border-color: var(--accent); color: var(--paper); }
  #panel .sub, #stats, #info .k, #loading { color: var(--muted); }
</style>
<script type="importmap">
{ "imports": { "three": "./lib/three.module.min.js", "three/addons/": "./lib/addons/",
               "@sparkjsdev/spark": "./lib/spark.module.min.js" } }
</script>
</head>
<body>
<div id="loading">loading splats…</div>
<div id="panel">
  <h1>Instrument tray · 3D Gaussian Splat</h1>
  <div class="sub" id="sub"></div>
  <div class="seg" id="modes"><button data-m="photo">Photo</button><button data-m="instance">Instance</button><button data-m="class">Class</button></div>
  <label class="tg"><input type="checkbox" id="boxes">3D boxes</label>
  <label class="tg"><input type="checkbox" id="tags">Labels</label>
  <label class="tg"><input type="checkbox" id="tools">Tools only</label>
  <details><summary>Instruments</summary><div id="list"></div></details>
  <div id="stats"></div>
</div>
<div id="info"></div>
<div id="warn"></div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";
import { SparkRenderer, SplatMesh, RgbaArray } from "@sparkjsdev/spark";

const Q = new URLSearchParams(location.search);
const reportError = () => {
  const loading = document.getElementById("loading");
  if (loading) loading.textContent = "3D viewer unavailable. Close this window to return to the scene preview.";
};
window.addEventListener("error", reportError);
window.addEventListener("unhandledrejection", reportError);
const vec = (s, d) => (s ? s.split(",").map(Number) : d);
const state = { mode: Q.get("mode") || "photo", boxes: Q.get("boxes") !== "0", tags: Q.get("tags") === "1",
                tools: Q.get("tools") === "1", hover: Q.get("hover") ? Number(Q.get("hover")) : 0, selected: 0 };

// ---------------------------------------------------------------- three.js + Spark
const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: false, powerPreference: "low-power" });
// Bound GPU fill cost regardless of the display's device-pixel ratio.
const pixelRatio = () => Math.min(window.devicePixelRatio, 1.5, Math.sqrt(1400000 / (innerWidth * innerHeight)));
renderer.setPixelRatio(pixelRatio());
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x1d1c18);
document.body.appendChild(renderer.domElement);
const tagRenderer = new CSS2DRenderer();
tagRenderer.setSize(window.innerWidth, window.innerHeight);
Object.assign(tagRenderer.domElement.style, { position: "absolute", top: "0", left: "0", pointerEvents: "none" });
document.body.appendChild(tagRenderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 50);
camera.position.fromArray(vec(Q.get("cam"), [0.0, 0.72, 0.78]));
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.fromArray(vec(Q.get("target"), [0.0, 0.0, 0.03]));
controls.enableDamping = true;
controls.minDistance = 0.08;
controls.maxDistance = 4;
controls.update();
scene.add(new SparkRenderer({ renderer }));

const [doc, labelBuf] = await Promise.all([fetch("labels.json").then((r) => r.json()),
                                           fetch("labels.bin").then((r) => r.arrayBuffer())]);
const labels = new Uint8Array(labelBuf);
const FILE = "scene.spz";
const mesh = new SplatMesh({ url: FILE, lod: false });
scene.add(mesh);
await mesh.initialized;
document.getElementById("loading").remove();
const n = mesh.packedSplats.numSplats;
if (n !== labels.length) {
  const w = document.getElementById("warn");
  w.textContent = `label/splat count mismatch: ${labels.length} labels vs ${n} splats`;
  w.style.display = "block";
}

// original colours / opacities (Photo mode keeps Spark's own SH shading; any override uses these)
const orig = new Uint8Array(n * 4);
mesh.packedSplats.forEachSplat((i, c, s, q, opacity, color) => {
  orig[4 * i] = Math.round(color.r * 255); orig[4 * i + 1] = Math.round(color.g * 255);
  orig[4 * i + 2] = Math.round(color.b * 255); orig[4 * i + 3] = Math.round(opacity * 255);
});
// per-splat RGBA override (Spark injects it in place of the splat's colour/opacity when mesh.splatRgba is set).
// ensureCapacity sizes the buffer to the texture layout; RgbaArray({array}) would copy a non-multiple-width array.
const rgba = new RgbaArray();
const rgbaArr = rgba.ensureCapacity(n);
rgba.count = n;

// ---------------------------------------------------------------- label tables
const inst = new Map(doc.instances.map((e) => [e.id, e]));
const pretty = (m) => (m || "-").replace(/__/g, " ").replace(/_/g, " ").replace(/^(\w+) \1 /, "$1 ");
const clsColor = Object.fromEntries(doc.classes.map((c) => [c.name, c.color]));
const hex3 = (h) => [1, 3, 5].map((k) => parseInt(h.slice(k, k + 2), 16));
const lutInst = new Uint8Array(256 * 3), lutCls = new Uint8Array(256 * 3), isTool = new Uint8Array(256);
for (const e of doc.instances) {
  lutInst.set(hex3(e.color), 3 * e.id);
  lutCls.set(hex3(clsColor[e.class_name] || "#888888"), 3 * e.id);
  isTool[e.id] = e.kind === "tool" ? 1 : 0;
}

function applyColors() {
  invalidate();
  const hot = state.hover || state.selected;
  const needOverride = state.mode !== "photo" || state.tools || hot;
  if (!needOverride) {
    if (mesh.splatRgba) { mesh.splatRgba = null; mesh.updateGenerator(); }
    return;
  }
  const lut = state.mode === "class" ? lutCls : lutInst;
  for (let i = 0; i < n; i++) {
    const id = labels[i], o = 4 * i;
    let r = orig[o], g = orig[o + 1], b = orig[o + 2], a = orig[o + 3];
    if (isTool[id]) {
      if (state.mode !== "photo") {             // label colour, modulated by the photo luminance to keep the shape readable
        const L = 0.35 + 0.65 * Math.min(1, (0.3 * r + 0.59 * g + 0.11 * b) / 160);
        r = lut[3 * id] * L; g = lut[3 * id + 1] * L; b = lut[3 * id + 2] * L;
      }
      if (hot && id === hot) { r = 255; g = 255; b = 255; }       // white: distinct from every class colour
      else if (hot) { r *= 0.55; g *= 0.55; b *= 0.55; }
    } else {
      if (state.tools) a = 0;
      else if (state.mode !== "photo" || hot) {   // stuff (drape / towel / rolls / unassigned) recedes
        const m = (r + g + b) / 3; r = g = b = m * 0.45;
      }
    }
    rgbaArr[o] = r; rgbaArr[o + 1] = g; rgbaArr[o + 2] = b; rgbaArr[o + 3] = a;
  }
  rgba.needsUpdate = true;
  if (mesh.splatRgba !== rgba) { mesh.splatRgba = rgba; mesh.updateGenerator(); }
  mesh.updateVersion();
}

// ---------------------------------------------------------------- boxes, tags, picking
const boxGroup = new THREE.Group(), pickGroup = new THREE.Group(), tagGroup = new THREE.Group();
scene.add(boxGroup, pickGroup, tagGroup);
const pickMat = new THREE.MeshBasicMaterial({ visible: false });
const boxes = new Map(), tags = new Map();
for (const e of doc.instances) {
  if (e.kind !== "tool" || !e.obb) continue;
  const [hx, hy, hz] = e.obb.half_extents;
  const g = new THREE.BoxGeometry(2 * hx, 2 * hy, 2 * hz);
  const M = new THREE.Matrix4().makeBasis(...e.obb.axes.map((a) => new THREE.Vector3(...a)))
    .setPosition(new THREE.Vector3(...e.obb.center));
  const lines = new THREE.LineSegments(new THREE.EdgesGeometry(g),
    new THREE.LineBasicMaterial({ color: e.color, transparent: true, opacity: 0.85 }));
  lines.applyMatrix4(M);
  boxGroup.add(lines);
  boxes.set(e.id, lines);
  const pick = new THREE.Mesh(g, pickMat);
  pick.applyMatrix4(M);
  pick.userData.id = e.id;
  pickGroup.add(pick);
  const top = e.obb.axes.reduce((s, a, k) => s + Math.abs(a[1]) * e.obb.half_extents[k], 0);
  const div = document.createElement("div");
  div.className = "tag";
  div.style.borderColor = e.color;
  div.textContent = `${e.class_name} ${e.id}`;
  const t = new CSS2DObject(div);
  t.position.set(e.obb.center[0], e.obb.center[1] + top, e.obb.center[2]);
  tagGroup.add(t);
  tags.set(e.id, t);
}

function refreshOverlay() {
  invalidate();
  const hot = state.hover || state.selected;
  boxGroup.visible = state.boxes;
  tagGroup.visible = true;                                     // the hovered / selected tool's tag always shows
  for (const [id, l] of boxes) {
    l.material.opacity = !hot || id === hot ? 0.9 : 0.25;
    l.material.color.set(id === hot ? "#ffffff" : inst.get(id).color);
  }
  for (const [id, t] of tags) {
    t.element.classList.toggle("hot", id === hot);
    t.visible = state.tags || id === hot;
    t.element.style.opacity = !hot || id === hot ? "1" : "0.35";
    if (id === hot) t.element.textContent = `${inst.get(id).class_name} ${id} · ${pretty(inst.get(id).model)}`;
    else t.element.textContent = `${inst.get(id).class_name} ${id}`;
  }
  document.querySelectorAll(".it").forEach((el) => el.classList.toggle("hot", Number(el.dataset.id) === hot));
  const info = document.getElementById("info");
  if (hot) {
    const e = inst.get(hot);
    info.innerHTML = `<b>${e.class_name} #${e.id}</b><br><span class="k">model</span> ${pretty(e.model)}<br>` +
      `<span class="k">pose</span> ${e.pose || "-"} · <span class="k">band</span> ${e.band || "-"}<br>` +
      `<span class="k">splats</span> ${e.n_splats.toLocaleString()} · <span class="k">label IoU</span> ${e.iou_check ?? "-"}<br>` +
      `<span class="k">object</span> ${e.name}`;
    info.style.display = "block";
  } else info.style.display = "none";
}

function setHover(id) {
  if (id === state.hover) return;
  state.hover = id;
  applyColors();
  refreshOverlay();
}

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let downXY = null;
let lastPick = 0;
renderer.domElement.addEventListener("pointermove", (ev) => {
  if (ev.buttons || performance.now() - lastPick < 50) return;
  lastPick = performance.now();
  ndc.set((ev.clientX / window.innerWidth) * 2 - 1, -(ev.clientY / window.innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(pickGroup.children, false)[0];
  setHover(hit ? hit.object.userData.id : 0);
});
renderer.domElement.addEventListener("pointerdown", (ev) => { downXY = [ev.clientX, ev.clientY]; });
renderer.domElement.addEventListener("pointerleave", () => setHover(0));
renderer.domElement.addEventListener("pointerup", (ev) => {
  if (!downXY || Math.hypot(ev.clientX - downXY[0], ev.clientY - downXY[1]) > 4) return;
  select(state.hover);
});
function select(id) {
  state.selected = id;
  if (id && inst.get(id).centroid) controls.target.fromArray(inst.get(id).centroid);
  applyColors();
  refreshOverlay();
}

// ---------------------------------------------------------------- panel
document.getElementById("sub").textContent =
  `${doc.num_splats.toLocaleString()} splats · ${doc.instances.filter((e) => e.kind === "tool").length} instruments · SH${doc.sh_degree}`;
const list = document.getElementById("list");
for (const c of doc.classes) {
  const box = document.createElement("div");
  box.className = "cls";
  box.innerHTML = `<div class="h"><span class="chip" style="background:${c.color}"></span>${c.name} <span style="color:#7f8aa0;font-weight:400">(${c.n_instances})</span></div>`;
  for (const e of doc.instances.filter((x) => x.class_name === c.name && x.kind === "tool")) {
    const it = document.createElement("button");
    it.type = "button";
    it.className = "it";
    it.dataset.id = e.id;
    it.innerHTML = `<span class="chip" style="background:${e.color}"></span><span class="m">#${e.id} ${pretty(e.model)}</span>` +
      `<span class="n">${(e.pose || "").replace("_", " ")}</span>`;
    it.onmouseenter = () => setHover(e.id);
    it.onmouseleave = () => setHover(0);
    it.onclick = () => select(state.selected === e.id ? 0 : e.id);
    box.appendChild(it);
  }
  if (box.querySelectorAll(".it").length) list.appendChild(box);
}
const lc = doc.label_check || {};
document.getElementById("stats").innerHTML =
  `label check vs Blender ID pass (${lc.views} held-out views): tools mIoU ${lc.miou_tools}, pixel acc ${lc.pixel_acc_fg}<br>` +
  `file ${FILE} · drag = orbit, right-drag = pan, wheel = zoom, click a tool = focus`;
for (const b of document.querySelectorAll("#modes button")) {
  b.classList.toggle("on", b.dataset.m === state.mode);
  b.onclick = () => {
    state.mode = b.dataset.m;
    document.querySelectorAll("#modes button").forEach((x) => x.classList.toggle("on", x === b));
    applyColors();
  };
}
for (const k of ["boxes", "tags", "tools"]) {
  const el = document.getElementById(k);
  el.checked = state[k];
  el.onchange = () => { state[k] = el.checked; applyColors(); refreshOverlay(); };
}

// Render bursts while the camera/labels change, rather than an endless GPU loop.
let frames = 0, pendingFrames = 0, frameRequest = 0, lastFrame = 0;
function invalidate(count = 30) {
  pendingFrames = Math.max(pendingFrames, count);
  document.body.dataset.renderState = "active";
  if (!document.hidden && !frameRequest) frameRequest = requestAnimationFrame(loop);
}
function loop(now) {
  frameRequest = 0;
  if (document.hidden) return;
  if (now - lastFrame >= 1000 / 30) {
    lastFrame = now;
    pendingFrames--;
    controls.update();
    renderer.render(scene, camera);
    tagRenderer.render(scene, camera);
    frames++;
    document.body.dataset.renderFrames = String(frames);
  }
  if (pendingFrames > 0) frameRequest = requestAnimationFrame(loop);
  else document.body.dataset.renderState = "idle";
}
controls.addEventListener("change", () => invalidate());
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { cancelAnimationFrame(frameRequest); frameRequest = 0; document.body.dataset.renderState = "paused"; }
  else invalidate();
});
applyColors();
refreshOverlay();
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(pixelRatio());
  renderer.setSize(window.innerWidth, window.innerHeight);
  tagRenderer.setSize(window.innerWidth, window.innerHeight);
  invalidate();
});
invalidate(120);
window.addEventListener("pagehide", () => {
  cancelAnimationFrame(frameRequest);
  controls.dispose();
  mesh.dispose();
  rgba.dispose?.();
  renderer.dispose();
  renderer.forceContextLoss();
});
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && window.parent !== window) window.parent.postMessage("medtech-close", location.origin);
});
window.__viewer = { get ready() { return frames > 0; }, get frames() { return frames; }, get idle() { return pendingFrames <= 0; },
                    n, nLabels: labels.length, file: FILE, state, renderFrames: invalidate,
                    setMode: (m) => { state.mode = m; applyColors(); }, setHover, select,
                    setToggle: (k, v) => { state[k] = v; document.getElementById(k).checked = v; applyColors(); refreshOverlay(); } };
</script>
</body>
</html>
